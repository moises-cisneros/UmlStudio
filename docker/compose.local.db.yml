services:
  db:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dbdata:/data
    command:
      - redis-stack-server
      - --dir
      - /data
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

volumes:
  dbdata:
