services:
  webapp:
    build:
      context: ..
      dockerfile: ./apps/webapp/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - server
    networks:
      - umlstudio-local

  server:
    build:
      context: ..
      dockerfile: ./apps/server/Dockerfile
    ports:
      - "8000:8000"
      - "4444:4444"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WS_PORT=4444
      - REDIS_URL=redis://db:6379
      - OWNER_SECRET=${OWNER_SECRET:-development-only-replace-in-prod}
      - JWT_SECRET=${JWT_SECRET:-umlstudio-development-jwt-secret-min-32-chars-2026!}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080,capacitor://localhost,ionic://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - umlstudio-local

  ai-service:
    build:
      context: ..
      dockerfile: ./apps/ai-service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ../apps/ai-service/.env
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8001
    networks:
      - umlstudio-local

  codegen:
    build:
      context: ..
      dockerfile: ./apps/codegen/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    networks:
      - umlstudio-local

  mcp-server:
    build:
      context: ..
      dockerfile: ./apps/mcp-server/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - MCP_PORT=8003
      - MCP_HOST=0.0.0.0
    networks:
      - umlstudio-local

  db:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "6379:6379"
    volumes:
      - dbdata:/data
    command:
      - redis-stack-server
      - --dir
      - /data
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    networks:
      - umlstudio-local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata:

networks:
  umlstudio-local:
    driver: bridge
