<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='15' x='3' y='3' rx='2'/><path d='M3 8h18'/><path d='M3 13h18'/><path d='m9 21 3-3 3 3'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <script>
      (function () {
        try {
          var rawTheme = window.localStorage.getItem("umlstudio-theme") || window.localStorage.getItem("umlstudio-theme");
          var storedTheme = rawTheme ? JSON.parse(rawTheme).state : null;
          var theme =
            storedTheme &&
            (storedTheme.userThemePreference || storedTheme.currentTheme);

          if (theme !== "dark" && theme !== "light") {
            theme =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }

          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <link href="/src/webapp.css" rel="stylesheet" />

    <title>UmlStudio</title>
    <!-- Runtime env written by the container entrypoint. 404-tolerant in dev. -->
    <script src="/env.js" defer></script>
  </head>
  <body>
    <div id="root">
      <div
        class="app-loading-screen app-loading-screen--boot"
        role="status"
        aria-label="Loading UmlStudio workspace..."
        aria-live="polite"
      >
        <div class="app-loading-content">
          <div class="app-loading-logo-shell flex items-center justify-center">
            <svg class="h-14 w-14 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="15" x="3" y="3" rx="2"/>
              <path d="M3 8h18"/>
              <path d="M3 13h18"/>
              <path d="m9 21 3-3 3 3"/>
            </svg>
          </div>
          <span class="app-loading-progress" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
