name: Task
description: A unit of work traceable to a PUDS cycle, use case and requirement.
labels: ["type:feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed (1-3 lines).
    validations:
      required: true
  - type: input
    id: traceability
    attributes:
      label: Traceability
      description: Cycle · iteration · use case · requirements
      placeholder: "Ciclo 2 · I1 · CU-15 · RF-51"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What to do
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable and verifiable. Include the automated test that covers it.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
