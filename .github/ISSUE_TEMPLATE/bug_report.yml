name: Bug report
description: Something does not work as expected.
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behavior, including the exact error message if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [webapp, server, core, ui, ai-service, codegen, mcp, infra]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Production / local · browser and version"
